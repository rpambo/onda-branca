  <!-- ================================================= -->
  <!-- VOLTAR AO TOPO                                    -->
  <!-- ================================================= -->

  <a
    onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    id="voltar-topo"
    class="uk-position-fixed uk-flex-middle uk-flex uk-icon-button"
    aria-label="Voltar ao topo"
    style="
      bottom: 100px;
      right: 35px;
      opacity: 0;
      z-index: 999;
      border-radius: 20px;
      background-color: #0067A3;
    "
  >
    <span
      class="uk-icon uk-flex-middle uk-flex"
      style="color: white;"
      uk-icon="icon: chevron-up"
    ></span>
  </a>

  <!-- ================================================= -->
  <!-- SCRIPT - VOLTAR AO TOPO                           -->
  <!-- ================================================= -->

  <script>
    const scrollBtn = document.getElementById('voltar-topo');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 500) {
        scrollBtn.style.opacity = '1';
      } else {
        scrollBtn.style.opacity = '0';
      }
    });
  </script>
