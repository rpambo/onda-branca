<div class="uk-position-relative uk-visible-toggle uk-light" 
     uk-slideshow="autoplay: true; animation: slide; pause-on-hover: false; ratio: false">

  <ul class="uk-slideshow-items" uk-height-viewport="offset-top: true">

    <!-- SLIDE 1 -->
    <li>
      <div class="uk-position-relative uk-height-1-1">
        <img data-src="imagens/home/hero_1.webp" uk-img alt="hero imagem 1" class="uk-visible@s" uk-cover>
        <img data-src="imagens/home/mobile-top-1.webp" uk-img class="uk-hidden@s" style="object-position: center top;" uk-cover alt="hero mobile imagem 1">
      </div>

      <div class="uk-container">
        <div class="uk-position-center-left uk-text-left text uk-padding-large conteudo">
          <p class="desc_1" style="color: #272727; font-size: 1.6rem; font-weight: 200; max-width: 400px; margin: 0; font-family: 'sora';">
            Programas de bem-estar, palestras, workshop e treinamentos para 
            <span style="font-weight: 500;">fortalecer equipes, individuos e promover saúde mental</span>
          </p>

          <a [routerLink]="['/contacto']" 
             class="uk-button uk-button-default btn-gradient-animated" 
             style="color: #fff; margin-top: 25px;">
            Comece aqui <span uk-icon="icon: arrow-right"></span>
          </a>
        </div>
      </div>
    </li>

    <!-- SLIDE 2 -->
    <li>
      <div class="uk-position-relative uk-height-1-1">
        <img data-src="imagens/home/hero_2.webp" uk-img class="uk-visible@s" alt="hero 2 imagem 2" uk-cover>
        <img data-src="imagens/home/mobile-top-2.webp" uk-img class="uk-hidden@s" style="object-position: center top;" uk-cover alt="hero mobile 2 imagem 2">
      </div>

      <div class="uk-container">
        <div class="uk-position-center-left uk-text-left uk-light text conteudo uk-padding-large">
          <img data-src="imagens/logos/aovivo.png" uk-img  width="120" alt="logo ao vivo onda branca">
          <h2 class="title" 
              style="font-weight: 200; margin-bottom: 0; font-size: 2.3rem; max-width: 500px; font-family: 'Joyride'; color: #272727; margin-top: 0;">
            Programa onda branca
          </h2>

          <p class="desc" style="color: #272727; font-weight: 400; font-size: 1.5rem; margin: 0; font-family: 'sora';">
            Na rádio solidaria | 90.7FM
          </p>

          <p class="text-gradient-animate">Todos sábados 9h - 10h</p>
        </div>
      </div>
    </li>

    <!-- SLIDE 3 -->
    <li>
      <div class="uk-position-relative uk-height-1-1">
        <img data-src="imagens/home/hero_3.webp" uk-img class="uk-visible@s" alt="hero 3 imagem 3" uk-cover>
        <img data-src="imagens/home/mobile-top-3.webp" uk-img class="uk-hidden@s" style="object-position: center top;" uk-cover alt="hero mobile 3 imagem 3">
      </div>

      <div class="uk-container">
        <div class="uk-position-center-left uk-text-left uk-light text uk-padding-large conteudo">
          <h2 class="title" 
              style="font-weight: 200; margin-bottom: 0; font-size: 1.8rem; max-width: 550px; text-transform: uppercase; font-family: 'Joyride'; color: #272727;">
            <span style="font-family: 'joryde';">o</span>n<span style="font-family: 'joryde';">d</span>a <span style="font-family: 'joryde';">b</span>ran<span style="font-family: 'joryde';">c</span>a p<span style="font-family: 'joryde';">o</span>dca<span style="font-family: 'joryde';">s</span>t
          </h2>

          <p class="desc" 
             style="color: #8f51c9; font-weight: 400; font-size: 1.5rem; margin: 0; font-family: 'sora';">
            Podcast de saúde mental
          </p>

          <a href="" class="uk-button uk-button-default btn-spotify" 
             style="background-color: #1DB954; color: white; border-radius: 5px; margin-top: 20px;">
            Ouvir agora <span class="fab fa-spotify" style="font-size: 1rem;"></span>
          </a>
        </div>
      </div>
    </li>

  </ul>

  <!-- DOTNAV CORRETO -->
  <ul class="uk-dotnav uk-slideshow-nav uk-position-center-right uk-position-medium uk-flex uk-flex-column">
    <li uk-slideshow-item="0"><a href="#"></a></li>
    <li uk-slideshow-item="1"><a href="#"></a></li>
    <li uk-slideshow-item="2"><a href="#"></a></li>
  </ul>

</div>
